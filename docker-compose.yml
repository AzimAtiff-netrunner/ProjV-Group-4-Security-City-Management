services:
  security-api:
    build:
      context: ./backend/CmSecurityService
      dockerfile: Dockerfile
    ports:
      - "5228:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      SecurityService__ServiceName: Security
      SecurityService__ExternalServiceTimeoutSeconds: "10"